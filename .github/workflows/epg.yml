name: epg

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build epg.json
        run: node build-epg.mjs
      - name: Commit if changed
        run: |
          git config user.name "tontonan-epg"
          git config user.email "actions@users.noreply.github.com"
          git add epg.json build-report.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "epg: scheduled update"
            git push
          fi
