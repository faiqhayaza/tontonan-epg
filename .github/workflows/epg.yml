name: epg

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SHA-pinned actions (actions/checkout@v4, actions/setup-node@v4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build epg.json
        # Exits non-zero when the failure gate trips (see build-epg.mjs):
        # a degraded build must not overwrite the last good epg.json.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: node build-epg.mjs
      - name: Commit epg.json if changed
        if: success()
        run: |
          git config user.name "tontonan-epg"
          git config user.email "actions@users.noreply.github.com"
          git add epg.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "epg: scheduled update"
            git push
          fi
      - name: Commit build-report.json if changed
        # Always runs, so a failed/gated build still leaves its report
        # (with the failing URL and gate reason) in the repo.
        if: always()
        run: |
          git config user.name "tontonan-epg"
          git config user.email "actions@users.noreply.github.com"
          git add build-report.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "epg: build report (failed build)"
            git push
          fi
